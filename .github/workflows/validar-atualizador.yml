name: Validar atualizador Android
on:
  push:
    paths:
      - 'patches/**'
      - 'updates/**'
      - '.github/workflows/validar-atualizador.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Preparar Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Montar codigo atualizavel
        run: |
          unzip -oq sentinela_source_payload.zip -d .
          python3 patches/ativar_v04.py
      - name: Verificar compilacao do codigo
        run: gradle --no-daemon :app:assembleDebug
      - name: Validar pacote e versao
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -F "package: name='br.gov.rs.sapucaiadosul.sentinela.atualizavel'"
