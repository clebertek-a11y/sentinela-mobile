name: Publicar SENTINELA 0.5 no canal atualizavel

on:
  push:
    paths:
      - '.github/workflows/publicar-v05-assinado.yml'
      - 'dist/SENTINELA-Mobile-0.5.0-ATUALIZACAO.apk'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Obter APK assinado
        uses: actions/checkout@v4

      - name: Verificar pacote, integridade e assinatura
        run: |
          set -euo pipefail
          APK="dist/SENTINELA-Mobile-0.5.0-ATUALIZACAO.apk"
          echo "2a9f837144037ea1b6972012efa1dcbe61338eaad55174bad49ab1a037906c64  $APK" | sha256sum -c
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$AAPT" dump badging "$APK" | grep -F "package: name='br.gov.rs.sapucaiadosul.sentinela.atualizavel' versionCode='11' versionName='0.5.0'"
          "$SIGNER" verify --print-certs "$APK" | grep -F "c4a13eaab0fbed00ddeb9e94b92183f3f8d3f40c9149f1266ac717f677ff920f"

      - name: Publicar download direto e anunciar versao 0.5
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="v0.5.0-atualizavel"
          APK="dist/SENTINELA-Mobile-0.5.0-ATUALIZACAO.apk"
          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --repo "$GH_REPO" --clobber
          else
            gh release create "$TAG" "$APK" --repo "$GH_REPO" --title "SENTINELA Mobile 0.5.0 - SIGOPE visual e operacional" --notes "Versao de testes: novo painel SIGOPE, recursos operacionais, historico em PDF e permissoes por perfil. Dados armazenados apenas no aparelho; sincronizacao entre dispositivos nao homologada. Atualizacao assinada com mesmo certificado da versao 0.4.0." --prerelease
          fi
          mkdir -p updates
          cat > updates/android-estavel.json <<'EOF'
          {
            "applicationId": "br.gov.rs.sapucaiadosul.sentinela.atualizavel",
            "versionCode": 11,
            "versionName": "0.5.0",
            "apkUrl": "https://github.com/clebertek-a11y/sentinela-mobile/releases/download/v0.5.0-atualizavel/SENTINELA-Mobile-0.5.0-ATUALIZACAO.apk",
            "notes": "Novo painel SIGOPE com identidade visual da Defesa Civil, aceitar atendimento, permissoes individuais e historico em PDF. Versao piloto.",
            "required": false
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/android-estavel.json
          if ! git diff --cached --quiet; then
            git commit -m "Atualizar catalogo Android para SENTINELA 0.5.0"
            git push origin HEAD:main
          fi
