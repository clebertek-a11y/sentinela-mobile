name: Publicar SENTINELA Mobile 0.4 atualizavel

on:
  workflow_dispatch:
  push:
    paths:
      - 'dist/SENTINELA-Mobile-0.4.0-ATUALIZAVEL.apk'
      - '.github/workflows/publicar-atualizavel-v04.yml'

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar integridade do APK assinado
        run: |
          echo "25809f77bfba996880129ac8c09d8d0272cffcbc2f048d80d7d6c4a4cd86501f  dist/SENTINELA-Mobile-0.4.0-ATUALIZAVEL.apk" | sha256sum -c
          test -s dist/SENTINELA-Mobile-0.4.0-ATUALIZAVEL.apk
          /usr/local/lib/android/sdk/build-tools/35.0.0/aapt dump badging dist/SENTINELA-Mobile-0.4.0-ATUALIZAVEL.apk | grep "package: name='br.gov.rs.sapucaiadosul.sentinela.atualizavel' versionCode='10' versionName='0.4.0'"
          /usr/local/lib/android/sdk/build-tools/35.0.0/apksigner verify --print-certs dist/SENTINELA-Mobile-0.4.0-ATUALIZAVEL.apk | grep "c4a13eaab0fbed00ddeb9e94b92183f3f8d3f40c9149f1266ac717f677ff920f"
      - name: Publicar APK em GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view v0.4.0-atualizavel --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload v0.4.0-atualizavel dist/SENTINELA-Mobile-0.4.0-ATUALIZAVEL.apk --clobber --repo "$GH_REPO"
          else
            gh release create v0.4.0-atualizavel dist/SENTINELA-Mobile-0.4.0-ATUALIZAVEL.apk --repo "$GH_REPO" --title "SENTINELA Mobile 0.4.0 - Canal atualizavel" --notes "VERSAO DE TESTES. Instalacao inicial separada das versoes antigas, com certificado de assinatura permanente para atualizacoes seguintes. O app consultara o catalogo de versoes ao abrir. Ainda nao usar em ocorrencias reais ou com dados pessoais." --prerelease
          fi
      - name: Ativar catalogo de atualizacoes
        run: |
          mkdir -p updates
          cat > updates/android-estavel.json <<'EOF'
          {
            "applicationId": "br.gov.rs.sapucaiadosul.sentinela.atualizavel",
            "versionCode": 10,
            "versionName": "0.4.0",
            "apkUrl": "https://github.com/clebertek-a11y/sentinela-mobile/releases/download/v0.4.0-atualizavel/SENTINELA-Mobile-0.4.0-ATUALIZAVEL.apk",
            "notes": "Canal atualizavel do SENTINELA: verificacao automatica de novas versoes ao abrir e consulta manual em Configuracoes.",
            "required": false
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/android-estavel.json
          if ! git diff --staged --quiet; then
            git commit -m "Ativar catalogo do SENTINELA atualizavel 0.4.0"
            git push
          fi
