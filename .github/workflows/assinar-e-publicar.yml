name: Publicar APK atualizavel

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SENTINELA_KEYSTORE_BASE64: ${{ secrets.SENTINELA_KEYSTORE_BASE64 }}
      SENTINELA_KEYSTORE_PASSWORD: ${{ secrets.SENTINELA_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Instalar ferramentas Android
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Preparar aplicativo e atualizador
        run: |
          unzip -oq sentinela_source_payload.zip -d .
          python3 patches/ativar_v04.py
      - name: Verificar segredos e preparar assinatura
        run: |
          set -euo pipefail
          if [ -z "$SENTINELA_KEYSTORE_BASE64" ] || [ -z "$SENTINELA_KEYSTORE_PASSWORD" ]; then
            echo "Configure os dois GitHub Actions Secrets para continuar."
            exit 1
          fi
          printf '%s' "$SENTINELA_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/sentinela-release.p12"
          chmod 600 "$RUNNER_TEMP/sentinela-release.p12"
          keytool -list -storetype PKCS12 -keystore "$RUNNER_TEMP/sentinela-release.p12" -storepass "$SENTINELA_KEYSTORE_PASSWORD" -alias sentinela-mobile > /dev/null
          echo "SENTINELA_KEYSTORE_PATH=$RUNNER_TEMP/sentinela-release.p12" >> "$GITHUB_ENV"
      - name: Compilar APK com assinatura permanente
        run: gradle --no-daemon :app:assembleRelease
      - name: Verificar APK
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='br.gov.rs.sapucaiadosul.sentinela.atualizavel'"
          mkdir -p distribuicao
          cp "$APK" distribuicao/SENTINELA-ATUALIZAVEL.apk
      - name: Publicar APK e atualizar catalogo
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION=$(grep -E 'versionName = ' app/build.gradle.kts | head -n1 | cut -d '"' -f2)
          CODE=$(grep -E 'versionCode = ' app/build.gradle.kts | head -n1 | sed -E 's/[^0-9]//g')
          TAG="sentinela-v$VERSION-atualizavel"
          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Versao $TAG ja publicada; aumente versionCode e versionName."
            exit 1
          fi
          gh release create "$TAG" distribuicao/SENTINELA-ATUALIZAVEL.apk --repo "$GH_REPO" --title "SENTINELA $VERSION - atualizavel" --notes "Versao de teste, assinada com chave persistente. Nao usar dados reais sem homologacao." --prerelease
          export VERSION CODE TAG
          python3 - <<'PY'
          import os,json,pathlib
          d={'applicationId':'br.gov.rs.sapucaiadosul.sentinela.atualizavel',
             'versionCode':int(os.environ['CODE']), 'versionName':os.environ['VERSION'],
             'apkUrl':'https://github.com/'+os.environ['GH_REPO']+'/releases/download/'+os.environ['TAG']+'/SENTINELA-ATUALIZAVEL.apk',
             'notes':'Atualizacao disponivel: melhorias no acesso e no atendimento.',
             'required':False}
          pathlib.Path('updates/android-estavel.json').write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/android-estavel.json
          git commit -m "Catalogo atualizado para $TAG"
          git push origin HEAD:main
