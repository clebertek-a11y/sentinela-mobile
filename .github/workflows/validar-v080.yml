name: SENTINELA 0.8 - Validacao tecnica
on:
  push:
    branches: [sentinela-0.8.0-consolidado]
    paths: ['.github/workflows/validar-v080.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Instalar SDK Android
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Compilar APK de validação
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Conferir pacote
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "versionCode='16' versionName='0.8.0-piloto'"
          cp "$APK" SENTINELA_0.8.0_VALIDACAO.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SENTINELA_0.8.0_VALIDACAO
          path: SENTINELA_0.8.0_VALIDACAO.apk
          if-no-files-found: error
