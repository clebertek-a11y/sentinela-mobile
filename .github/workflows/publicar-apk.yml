name: Publicar APK SENTINELA 0.2 (somente testes)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publicar-apk.yml'

permissions:
  contents: write
  actions: read

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar APK validado no GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p release
          gh run download 44217792323 --repo "$GH_REPO" --name SENTINELA-Mobile-APK-Teste --dir release
          test -s release/app-debug.apk
          mv release/app-debug.apk release/SENTINELA-Mobile-0.2-TESTE.apk
          sha256sum release/SENTINELA-Mobile-0.2-TESTE.apk

      - name: Publicar link direto (sem ZIP)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view v0.2.0-teste --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload v0.2.0-teste release/SENTINELA-Mobile-0.2-TESTE.apk --repo "$GH_REPO" --clobber
          else
            gh release create v0.2.0-teste release/SENTINELA-Mobile-0.2-TESTE.apk --repo "$GH_REPO" --title "SENTINELA Mobile 0.2 - somente testes" --notes "Versão de testes, NÃO usar com dados de ocorrências reais. Senha mínima 8 caracteres com maiúscula, minúscula, número e símbolo. Opção de conta DEMO 9999 / Boco@123. Mostrar e confirmar senha, layout rolável com teclado e verificação de atualizações pelo GitHub. ATENÇÃO: APK de depuração com chave gerada no servidor; a substituição da versão 0.1 pode falhar por incompatibilidade de assinatura. Não desinstale a versão anterior antes de exportar todos os documentos. Não usar os logins DEMO em produção." --prerelease
          fi
