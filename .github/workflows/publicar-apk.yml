name: Publicar link direto do APK de teste

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publicar-apk.yml'

permissions:
  contents: write
  actions: read

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o APK da compilacao validada
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p release
          gh run download 44213113882 --repo "$GH_REPO" --name SENTINELA-Mobile-APK-Teste --dir release
          test -s release/app-debug.apk
          mv release/app-debug.apk release/SENTINELA-Mobile-0.1-TESTE.apk
          sha256sum release/SENTINELA-Mobile-0.1-TESTE.apk

      - name: Disponibilizar instalador como link direto
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view v0.1.0-teste --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload v0.1.0-teste release/SENTINELA-Mobile-0.1-TESTE.apk --repo "$GH_REPO" --clobber
          else
            gh release create v0.1.0-teste release/SENTINELA-Mobile-0.1-TESTE.apk --repo "$GH_REPO" --title "SENTINELA Mobile 0.1 - somente testes" --notes "VERSAO EXPERIMENTAL: nao utilizar em atendimentos reais. App Android independente, assinado com chave de depuracao. Instalar somente em aparelhos autorizados. Nao utilizar dados pessoais ou senhas reais nesta fase." --prerelease
          fi
