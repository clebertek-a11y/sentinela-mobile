name: TEMPO - Teste CEMADEN por estação
on:
  push:
    branches: [tempo-android-piloto-isolado]
    paths: ['.github/workflows/tempo-verificar-horario.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  consultar:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Resposta das leituras individuais
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,json
          for idpcd in [4331,4329,4330,6238]:
            u=f"https://mapservices.cemaden.gov.br/MapaInterativoWS/resources/horario/{idpcd}/720"
            try:
              req=urllib.request.Request(u,headers={"User-Agent":"Mozilla/5.0","Accept":"application/json"})
              with urllib.request.urlopen(req,timeout=14) as f:
                s=f.read(4000000).decode("utf-8-sig","replace")
                print("HTTP",idpcd,f.status,f.headers.get('content-type'),len(s))
              j=json.loads(s)
              print("KEYS",idpcd,list(j))
              print("ESTACAO",str(j.get("estacao"))[:300])
              print("DATES_TAIL",str(j.get("datas",[])[-3:]))
              print("HOURS_TAIL",str(j.get("horarios",[])[-3:]))
              print("ACC_ROWS",idpcd,len(j.get("acumulados",[])))
            except Exception as e:
              print("ERRO",idpcd,repr(e))
          PY
