name: TEMPO 1.0.0 - Compilacao oficial sem chave no GitHub
on:
  push:
    branches: [tempo-android-oficial-v1]
    paths-ignore: [ 'downloads/**' ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preparar-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout do projeto TEMPO isolado
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Instalar Android SDK 35
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Construir fonte da versao oficial 1.0.0
        run: |
          mkdir -p tempo
          unzip -oq tempo-source.zip -d tempo
          python3 tempo_patch_021.py tempo
          python3 tempo_patch_v030.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path("tempo/app/build.gradle")
          s = p.read_text()
          assert "versionCode 4" in s and "versionName '0.3.0'" in s
          p.write_text(s.replace('versionCode 4','versionCode 10000').replace("versionName '0.3.0'","versionName '1.0.0'"))
          h = Path("tempo/app/src/main/assets/index.html")
          c = h.read_text().replace("Versão piloto 0.3.0", "Versão 1.0.0")
          h.write_text(c)
          j = Path("tempo/app/src/main/assets/app.js")
          j.write_text(j.read_text().replace("0.3.0", "1.0.0"))
          a = Path("tempo/app/src/main/java/br/com/iantzen/tempo/MonitorBridge.java")
          a.write_text(a.read_text().replace("TEMPO-Sapucaia-Android/0.3", "TEMPO-Sapucaia-Android/1.0.0"))
          print("SOURCE_VERSION",p.read_text().split("versionCode")[1].splitlines()[0],p.read_text().split("versionName")[1].splitlines()[0])
          PY
          node --check tempo/app/src/main/assets/app.js
          test -s tempo/app/src/main/assets/img/logo_tempo.webp
          grep -q "br.com.iantzen.tempo" tempo/app/build.gradle
      - name: Compilar release sem assinatura
        run: gradle --project-dir tempo :app:assembleRelease --no-daemon --stacktrace
      - name: Alinhar APK e preparar ferramenta de assinatura local
        run: |
          set -eu
          test -s tempo/app/build/outputs/apk/release/app-release-unsigned.apk
          mkdir -p downloads
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 tempo/app/build/outputs/apk/release/app-release-unsigned.apk downloads/TEMPO-1.0.0-aligned-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 downloads/TEMPO-1.0.0-aligned-unsigned.apk
          test -s "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar"
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" downloads/apksigner-android-sdk.jar
          sha256sum downloads/TEMPO-1.0.0-aligned-unsigned.apk
      - name: Publicar artefato tecnico sem segredo
        uses: actions/upload-artifact@v4
        with:
          name: TEMPO-1.0.0-unsigned-e-ferramenta
          path: |
            downloads/TEMPO-1.0.0-aligned-unsigned.apk
            downloads/apksigner-android-sdk.jar
          retention-days: 14
          if-no-files-found: error
      - name: Publicar artefatos tecnicos sem assinatura no ramo isolado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/TEMPO-1.0.0-aligned-unsigned.apk downloads/apksigner-android-sdk.jar
          git commit -m "Artefatos para assinatura local TEMPO 1.0.0 [skip ci]"
          git push origin HEAD:tempo-android-oficial-v1
